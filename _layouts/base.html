<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}" />
  <meta name="robots" content="index, follow" />

  <meta property="og:title"       content="{{ title }}" />
  <meta property="og:description" content="{{ description }}" />
  <meta property="og:type"        content="{{ ogType or 'website' }}" />
  {% if ogUrl %}<meta property="og:url" content="{{ ogUrl }}" />{% endif %}
  <meta property="og:site_name"   content="Sheety Tools" />

  {% if jsonLd %}{{ jsonLd | safe }}{% endif %}

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/public/Sheety_Logo.png" />
  <link rel="stylesheet" href="/css/shared.css" />

  {% if pageStyles %}
  <style>{{ pageStyles | safe }}</style>
  {% endif %}
</head>
<body>

  {% include "nav.html" %}

  {{ content | safe }}

  {% include "footer.html" %}
  {% include "nav-script.html" %}

</body>
</html>
