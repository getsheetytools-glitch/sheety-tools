<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Priority Pie</title>

  <style>
    /* ---------------------------
       Base + Theme
    --------------------------- */
    :root {
      --bg-1: #0b0f17;
      --bg-2: #121a2a;

      --glass-bg: rgba(18, 24, 38, 0.55);
      --glass-border: rgba(255,255,255,0.12);
      --glass-hover: rgba(18, 24, 38, 0.72);
      --glass-shadow: 0 14px 40px rgba(0,0,0,0.45);
      --blur: 12px;

      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;

      --text-main: rgba(255,255,255,0.95);
      --text-muted: rgba(255,255,255,0.65);

      --accent-green: #5cb85c;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 600px at 20% 0%, #1a0f1f, transparent 60%),
        radial-gradient(900px 600px at 80% 100%, #0d2a3a, transparent 55%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2));
      color: var(--text-main);
    }

    /* ---------------------------
       App Container
    --------------------------- */
    .app {
      max-width: 980px;
      margin: 48px auto;
      padding: 24px;
    }

    .card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      padding: 24px;
    }

    /* ---------------------------
       Header
    --------------------------- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ---------------------------
       Inputs & Buttons
    --------------------------- */
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.06);
      color: var(--text-main);
      outline: none;
    }

    input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    button {
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.08);
      color: var(--text-main);
      cursor: pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.22);
    }

    button:active {
      transform: translateY(0);
    }

    .muted {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    /* ---------------------------
       Main Layout
    --------------------------- */
    .content {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
    }

    .panel {
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 18px;
      min-height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }

    .panel h4 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 13px;
      letter-spacing: 0.4px;
      color: rgba(255,255,255,0.8);
    }

    /* ---------------------------
       Footer
    --------------------------- */
    .footer {
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer a {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* ---------------------------
       Floating Buttons
    --------------------------- */
    .floating {
      position: fixed;
      left: 18px;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      text-decoration: none;
      color: #fff;
      transition: transform .12s ease, background .12s ease;
    }

    .floating:hover {
      transform: translateY(-2px);
      background: var(--glass-hover);
    }

    .sheety-float {
      bottom: 84px;
    }

    .sheety-float img {
      width: 26px;
      height: 26px;
      border-radius: 8px;
    }

    .sheety-float span {
      font-size: 13px;
      white-space: nowrap;
    }

    @media (max-width: 760px) {
      .content {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="app">
    <div class="card">
      <div class="header">
        <div>
          <div class="title">Priority Pie</div>
          <div class="subtitle">Your top priority gets the biggest slice. Reorder to resize.</div>
        </div>
        <button id="clearAll">Clear All</button>
      </div>

      <div class="input-row">
        <input id="priorityInput" type="text" placeholder="Add a priority…" />
        <button id="addPriority">Add</button>
      </div>

      <div class="muted">0 priorities · 0% allocated</div>

      <div class="content">
        <div class="panel">
          Your pie is empty<br />Add priorities to slice it up!
        </div>

        <div class="panel">
          <h4>PRIORITIES</h4>
        </div>
      </div>

      <div class="footer">
        Click slices to adjust ·
        <span style="color:#5cb85c">High Priority</span> →
        <span style="color:#d9534f">Low Priority</span><br />
        <a href="#">License</a>
      </div>
    </div>
  </div>

  <!-- Sheety floating button -->
  <a
    href="https://sheety.tools"
    target="_blank"
    rel="noopener noreferrer"
    class="floating sheety-float"
  >
    <img src="./Sheety_Logo.png" alt="Sheety Tools" />
    <span>Sheety Tools</span>
  </a>

  <!-- Ko-fi -->
  <script src="https://storage.ko-fi.com/cdn/scripts/overlay-widget.js"></script>
  <script>
    kofiWidgetOverlay.draw("sheetytools", {
      type: "floating-chat",
      "floating-chat.donateButton.text": "Support me",
      "floating-chat.donateButton.background-color": "#1b2230",
      "floating-chat.donateButton.text-color": "#ffffff"
    });
  </script>

</body>
</html>
